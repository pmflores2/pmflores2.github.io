name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          # - removed md files that include liquid tags
          # - CUSTOMIZE.md / INSTALL.md are upstream al-folio docs that point to files this site doesn't have
          # - --exclude '%7B%7B' skips <img src="{{ ... | relative_url }}"> in md files (lychee sees the raw liquid tag; Jekyll resolves it fine)
          # - --accept 403,429: publishers (APS, Google Scholar, ScienceDirect, AIP, ...) block bots but the links work in a browser
          # - retries + longer timeout for slow conference sites
          args: >-
            --user-agent 'curl/7.54'
            --accept '100..=103,200..=299,403,429'
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --exclude '%7B%7B'
            --exclude-path README.md
            --exclude-path CUSTOMIZE.md
            --exclude-path INSTALL.md
            --exclude-path _pages/404.md
            --exclude-path _pages/blog.md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude-path _posts/2023-04-24-videos.md
            --exclude-path _books/the_godfather.md
            --verbose --no-progress './**/*.md' './**/*.html'
