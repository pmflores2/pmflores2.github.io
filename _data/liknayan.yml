about: |
  Liknayan Podcast is a science communication initiative focused on physics that shines the spotlight on Pinoy physicists by showcasing their research, insights, and fascinating journey in science. Our conversations are conducted in Filipino, and we simplify complex concepts to make physics more accessible and enjoyable for everyone.

  `Liknayan` is the Filipino word for physics and is a blend of the words `likas`, which means natural, and `hanayan`, which is associated with organizing and tallying. Our dedication to the podcast stems from our shared passion for communicating the remarkable work of Pinoy physicists, driven by our commitment to inspire the next generation of students to pursue careers in science.

  For general inquiries, partnerships, and collaborations, please contact us at `liknayan.podcast@gmail.com`.

